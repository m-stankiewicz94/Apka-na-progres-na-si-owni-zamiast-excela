<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1017">
  <meta name="description" content="Dziennik treningowy — plan A/B/C, bieganie, pomiary. Działa offline.">
  <title>Trening</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trening">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Trening</h1>
    <span id="weekchip" class="chip" hidden></span>
  </header>

  <main id="view" aria-live="polite"></main>

  <div id="timerbar" class="timerbar" hidden>
    <div class="timerinfo">
      <span class="timerlabel" id="timerlabel">Przerwa</span>
      <strong class="timertime" id="timertime">0:00</strong>
    </div>
    <button id="timerstop" class="btn ghost" type="button" aria-label="Zatrzymaj timer">✕</button>
  </div>

  <div id="toast" class="toast" hidden></div>

  <nav class="bottomnav" aria-label="Nawigacja">
    <a href="#/home" data-nav="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      <span>Start</span>
    </a>
    <a href="#/run" data-nav="run">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="14" cy="4.5" r="1.8"/><path d="M9 20l2.5-5L9 12l3-4 3 2.5 3.5.5"/><path d="M12 8l-4 1.5L6.5 13"/><path d="M11.5 15L15 17l1 4"/></svg>
      <span>Bieganie</span>
    </a>
    <a href="#/measure" data-nav="measure">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l4-6 4 3 5-8 5 6"/><path d="M3 21h18"/></svg>
      <span>Pomiary</span>
    </a>
    <a href="#/history" data-nav="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      <span>Historia</span>
    </a>
    <a href="#/guide" data-nav="guide">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15.5H5.5A1.5 1.5 0 0 0 4 21z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v15.5h5.5A1.5 1.5 0 0 1 20 21z"/></svg>
      <span>Instrukcja</span>
    </a>
    <a href="#/settings" data-nav="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>
      <span>Więcej</span>
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
