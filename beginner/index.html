<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1519" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Twój dziennik treningowy na start: plan A/B, rozgrzewka, kardio, pomiary, zdjęcia i wiedza. Działa offline.">
  <title>Progres</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Progres">
  <link rel="preload" href="fonts/manrope-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/manrope-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('gf.settings');
        var t = raw ? JSON.parse(raw).d.theme : null;
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="top" id="top">
    <a class="brand" href="#/home" aria-label="Start">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="3.2" stroke-dasharray="52 18" stroke-linecap="round" transform="rotate(-90 16 16)"/><circle cx="16" cy="16" r="4" fill="currentColor"/></svg>
      <span>Progres</span>
    </a>
    <span id="weekchip" class="chip" hidden></span>
  </header>

  <main id="view"></main>

  <div id="timerbar" class="timerbar" hidden role="status">
    <div class="timerinfo">
      <span class="timerlabel" id="timerlabel">Przerwa</span>
      <strong class="timertime" id="timertime">0:00</strong>
    </div>
    <button id="timerstop" class="iconbtn" type="button" aria-label="Zamknij timer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <nav class="bottomnav" aria-label="Nawigacja">
    <a href="#/home" data-nav="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5 12 4l8.5 7.5"/><path d="M5.5 10.5V20h4.5v-5h4v5h4.5v-9.5"/></svg>
      <span>Start</span>
    </a>
    <a href="#/warmup" data-nav="warmup">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c.5 3-2.2 4.4-2.2 7 0 1.4.9 2.4 2 2.4.1-1.5 1-2.1 1.6-3 1.5 1.5 2.6 3 2.6 5.3A4 4 0 0 1 8 14.7C8 10 11 8.5 12 3z"/></svg>
      <span>Rozgrzewka</span>
    </a>
    <a href="#/cardio" data-nav="cardio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 3 12 2.5-8 1.5 2H21"/></svg>
      <span>Kardio</span>
    </a>
    <a href="#/measure" data-nav="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l4.5-6 4 3 4-6 3.5 4.5"/><path d="M4 21h16"/></svg>
      <span>Postępy</span>
    </a>
    <a href="#/learn" data-nav="learn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15.5H5.5A1.5 1.5 0 0 0 4 21z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v15.5h5.5A1.5 1.5 0 0 1 20 21z"/></svg>
      <span>Wiedza</span>
    </a>
    <a href="#/settings" data-nav="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>
      <span>Więcej</span>
    </a>
  </nav>

  <script src="content.js"></script>
  <script src="app.js"></script>
  <script src="screens.js"></script>
</body>
</html>
